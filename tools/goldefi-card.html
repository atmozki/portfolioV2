<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 900px; height: 675px; background: #e9e4d9; display: grid; place-items: center; font-family: 'Fraunces', Georgia, serif; }
  .sheet {
    width: 560px; height: 560px; background: #faf8f2; color: #171410;
    box-shadow: 0 24px 60px rgba(23,20,16,0.18);
    padding: 56px 52px; display: flex; flex-direction: column;
  }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #6f695e; }
  h1 { font-weight: 350; font-size: 44px; line-height: 1.08; margin: 22px 0 10px; }
  .em { font-style: italic; color: #b6410f; }
  .rule { height: 1px; background: #ddd7ca; margin: 22px 0; }
  .line { height: 8px; background: #e7e2d6; border-radius: 2px; margin-bottom: 12px; }
  .l1 { width: 92%; } .l2 { width: 86%; } .l3 { width: 95%; } .l4 { width: 64%; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; }
  .foot .mono { font-size: 11px; }
</style>
</head>
<body>
  <div class="sheet">
    <span class="mono">Published research &middot; 2023</span>
    <h1>GoldeFi: <span class="em">Unified Gold Protocol</span></h1>
    <span class="mono" style="font-size:11px">Kuriakose, D. J., et al.</span>
    <div class="rule"></div>
    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
    <div class="line l4"></div>
    <div class="foot">
      <span class="mono">IRJMETS</span>
      <span class="mono">DOI 10.56726/IRJMETS42226</span>
    </div>
  </div>
</body>
</html>
