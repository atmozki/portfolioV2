<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found · Dennis Jojo Kuriakose</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
      background: #f4f1ea; color: #171410; padding: 2.5rem;
      font-family: 'Fraunces', Georgia, serif;
    }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: #6f695e; }
    h1 { font-weight: 320; font-size: clamp(2.6rem, 9vw, 6.5rem); line-height: 1.02; margin: 1.2rem 0 0.6rem; }
    h1 em { color: #b6410f; }
    p { color: #6f695e; font-size: 1.05rem; max-width: 26rem; font-style: italic; }
    a.home {
      display: inline-block; margin-top: 2.5rem; color: #171410; text-decoration: none;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
      border-bottom: 1px solid #171410; padding-bottom: 0.2rem;
    }
    a.home:hover { color: #b6410f; border-color: #b6410f; }
  </style>
</head>
<body>
  <span class="mono">404 · Page not found</span>
  <h1>Lost the <em>thread.</em></h1>
  <p>This page does not exist, or it wandered off. The rest of the site is still where it should be.</p>
  <a class="home" id="home" href="/">Back home</a>
  <script>
    /* GitHub Pages serves this at any depth. On a project site the home is
       /<repo>/, on a custom domain it is /. Derive it instead of hardcoding. */
    var seg = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && seg) {
      document.getElementById('home').href = '/' + seg + '/';
      document.querySelector('link[rel="icon"]').href = '/' + seg + '/favicon.svg';
    }
  </script>
</body>
</html>
